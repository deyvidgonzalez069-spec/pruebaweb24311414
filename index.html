<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Pagina</title>
    <link rel="stylesheet" href="index.css">
</head>
<body class="grid-container">

    <header class="header">
        <h1 class="Snorlax">Snorlax</h1>
    </header>

    <nav class="navbar">
        <div class="conter">
            <div class="Imagen"> 
                <img src="Snorlax.png" alt="Snorlax">
            </div>
        </div>

        <div class="info">
            <h2>Descripcion: Ta grandote</h2>
            <h2>Tipo: Normalon</h2>
            <h2>Numero en la pokedex: #143</h2>   
            <h2>Resistente a: Tipo Fantasma </h2>
            <h2>Debilidad: La comida jsjsj</h2>
        </div>
    </nav>

    <section class="video-section">
        <div class="video-container">
            <iframe 
                src="https://www.youtube.com/embed/Ko5aLABnfZw" 
                title="Snorlax & Cubone" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
            </iframe>
        </div>
    </section>

    <footer class="footer">
        <p>si lo lees me debes un chocolate jsjsj</p>
    </footer>

    <div id="fullScreenOverlay" class="overlay">
        <span class="close-btn">&times;</span>
        <img id="fullScreenImage" src="" alt="Snorlax Grande">
    </div>

    <script src="index.js"></script>

</body>
</html>
